plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.randomittin.voiceassistant'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.randomittin.voiceassistant'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    // Test only (never in the APK): plain JVM tests for the pure logic in src/test. org.json is
    // Android's own at run time; the JVM needs the real library to run the JSON builders.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
